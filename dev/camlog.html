<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Dev only: camera smoothness harness. Runs the whole journey offline
     with a fixed dt (no GPU frames), auto-taps, and writes a per-frame
     JSON log into #out. Read it with analysis/camera_smoothness.py.
     Params: dt=30|60|144|jitter (default 60), hold=S (extra view seconds
     before each tap, default 0), seed=N (route seed, default 1),
     dim=S (at the first stop with a portal: enter it, stay S seconds in
     the dimension, come back out, then go on; default off). -->
<base href="../">
<title>camlog</title>
<script>
// Seed Math.random before any module runs, so the route is the same every run.
// three.js object ids (generateUUID) take their own stream: a new mesh or
// material then does not change the route, so runs before and after a
// change stay comparable.
(function () {
    const q = new URLSearchParams(location.search);
    const stream = (a) => function () {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const route = stream(Number(q.get('seed') || 1) >>> 0), ids = stream(0x9E3779B9);
    Math.random = function () { return /generateUUID/.test(new Error().stack) ? ids() : route(); };
})();
</script>
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>
</head>
<body>
<canvas id="attractor"></canvas>
<pre id="out"></pre>
<script type="module">
import * as THREE from 'three';
import { init as initScene, camera, controls } from './js/attractors.js';
import * as orch from './js/orchestrator.js';
import * as cam from './js/camera.js';
import * as portal from './js/portal.js';

const q = new URLSearchParams(location.search);
const dtMode = q.get('dt') || '60';
const hold = Number(q.get('hold') || 0);
const portalStay = q.has('dim') ? Number(q.get('dim') || 1) : -1;   // not 'portal': that is the page's own dev param
let portalDone = portalStay < 0, dimAt = -1;
const MAX_TIME = 240;           // seconds; safety cap

// Jitter: own RNG so the route (Math.random) stays the same as the fixed-dt runs
let js = 12345;
function jr() { js = (js * 1103515245 + 12345) % 2147483648; return js / 2147483648; }
function nextDt() {
    if (dtMode !== 'jitter') return 1 / Number(dtMode);
    if (jr() < 0.03) return 0.05 + 0.05 * jr();     // dropped frames
    return (1 / 60) * (0.6 + 0.8 * jr());           // 10-28 ms
}

initScene(document.getElementById('attractor'));
orch.init();
orch.setSkipRender(true);

const r = v => Math.round(v * 1e7) / 1e7;
const v3 = v => [r(v.x), r(v.y), r(v.z)];
const fwd = new THREE.Vector3(), up = new THREE.Vector3(), ray = new THREE.Vector3();
const frames = [];
let t = 0, lastStop = -1, endAt = Infinity;

while (t < Math.min(MAX_TIME, endAt)) {
    const s = orch.devState();
    // Portal step (dim=S): enter at the first portal stop (no tap there
    // until it is done), stay S s in the dimension, then come back out
    const atPortal = !portalDone && s.portal;
    if (atPortal && s.phase === orch.Phase.VIEW) portal.enterPortal();   // waits for the view delay
    if (atPortal && s.phase === orch.Phase.DIMENSION) {
        if (dimAt < 0) dimAt = t;
        if (t - dimAt >= portalStay) { portal.exitPortal(); portalDone = true; }
    }
    // Auto-tap: the intro after 1 s, and every VIEW frame after `hold`.
    // The orchestrator keeps the tap until the stop's VIEW_TAP_DELAY.
    if ((s.phase === orch.Phase.INTRO && t > 1) ||
        (s.phase === orch.Phase.VIEW && s.phaseTime >= hold && !atPortal)) orch.onTap();

    const dt = nextDt();
    orch.update(dt);
    t += dt;

    const o = orch.devState(), c = cam.devState();
    camera.updateMatrixWorld();
    fwd.set(0, 0, -1).applyQuaternion(camera.quaternion);
    up.set(0, 1, 0).applyQuaternion(camera.quaternion);
    // Screen-center ray, with the panel view offset applied
    ray.set(0, 0, 0.5).unproject(camera).sub(camera.position).normalize();
    frames.push({
        t: r(t), dt: r(dt), phase: o.phase, stop: o.stopIndex, mode: c.mode,
        comet: v3(o.worldPos), head: v3(o.cometPos),
        cam: v3(camera.position), look: v3(controls.target),
        fwd: v3(fwd), up: v3(up), ray: v3(ray),
        dist: r(c.chaseDist), distTarget: r(c.chaseDistTarget), shift: r(c.shift),
        tunnel: o.tunnelFlight ? 1 : 0, hs: r(o.headS)
    });

    // End 3 s after the tour loops back to the first rock
    if (o.phase === orch.Phase.VIEW && o.stopIndex !== lastStop) {
        if (o.stopIndex === 1 && lastStop > 1) endAt = t + 3;
        lastStop = o.stopIndex;
    }
}

document.getElementById('out').textContent = JSON.stringify({
    dtMode, hold, seed: Number(q.get('seed') || 1), portal: portalStay,
    width: innerWidth, height: innerHeight,
    phases: orch.Phase, frames
});
document.title = 'done';
</script>
</body>
</html>
